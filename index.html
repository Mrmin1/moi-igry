<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMrGAMES — Windows XP</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Tahoma,Verdana,Arial,sans-serif;font-size:12px}
#desktop{position:fixed;inset:0 0 32px 0;background:radial-gradient(ellipse 90% 55% at 50% 0%, #7db9e8 0%, #3a8fd9 35%, #2f7fc9 60%, #5aa33a 60.2%, #6ab84a 75%, #3f8f2e 100%);overflow:hidden;user-select:none}
#desktop:before{content:"";position:absolute;left:-10%;top:6%;width:38%;height:18%;background:#fff;border-radius:50%;opacity:.85;filter:blur(6px)}
#desktop:after{content:"";position:absolute;left:55%;top:2%;width:45%;height:16%;background:#fff;border-radius:50%;opacity:.7;filter:blur(8px)}
#hill{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(180deg,#7cc24a 0%,#4da52e 35%,#2e7d1e 100%);border-radius:50% 50% 0 0/90px 90px 0 0}
#icons{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:16px;flex-wrap:wrap;max-height:calc(100% - 20px);z-index:2}
.icon{width:84px;text-align:center;cursor:pointer;padding:6px 2px;border:1px dotted transparent;border-radius:2px}
.icon.selected{background:rgba(255,255,255,.25);border-color:#fff}
.icon .logo{width:48px;height:48px;margin:0 auto 5px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4);box-shadow:inset 0 -8px 14px rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.5)}
.icon span{display:block;color:#fff;text-shadow:1px 1px 2px #000;font-size:12px}
.icon small{display:block;color:#e8f4ff;text-shadow:1px 1px 2px #000;font-size:10px}
#hint{position:absolute;top:12px;right:14px;z-index:2;background:rgba(0,0,0,.35);color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;max-width:260px;line-height:1.4}
#hint b{color:#ffe28a}
#taskbar{position:fixed;left:0;right:0;bottom:0;height:32px;background:linear-gradient(180deg,#0997ff 0%,#0055e5 50%,#0055e5 100%);display:flex;align-items:stretch;z-index:50;color:#fff}
#startBtn{background:linear-gradient(180deg,#5ad84a,#1f9d2a 50%,#0f7a1a);border:0;border-radius:0 12px 12px 0;color:#fff;font-style:italic;font-weight:700;font-size:15px;padding:0 22px 0 14px;cursor:pointer}
#taskbar .tasks{flex:1;display:flex;gap:4px;align-items:center;padding:0 8px;overflow:hidden}
.taskBtn{background:#3a7bd5;border:1px solid #1c4fa0;color:#fff;padding:4px 10px;border-radius:3px;cursor:pointer}
#clock{background:linear-gradient(180deg,#19b2f5,#0a7ad1);padding:0 14px;display:flex;align-items:center;gap:8px}
#startMenu{position:fixed;left:0;bottom:32px;width:360px;max-width:92vw;background:#fff;border-radius:8px 8px 0 0;overflow:hidden;display:none;z-index:60;box-shadow:4px -4px 20px rgba(0,0,0,.5)}
#startMenu.open{display:block}
#smHead{background:linear-gradient(180deg,#0997ff,#0055e5);color:#fff;padding:14px 12px;font-size:18px;font-weight:700}
#smBody{display:flex;min-height:260px}#smLeft{flex:1;padding:8px}#smRight{width:145px;background:#d3e5fa;padding:8px}
.smItem{padding:7px 8px;cursor:pointer;border-radius:3px;display:flex;gap:8px;align-items:center}
.smItem:hover{background:#316ac5;color:#fff}.smItem small{display:block;color:#808080}.smItem:hover small{color:#fff}
#smFoot{background:linear-gradient(180deg,#0997ff,#0055e5);display:flex;justify-content:flex-end;gap:10px;padding:8px;color:#fff}
#smFoot button{background:none;border:0;color:#fff;cursor:pointer;font-weight:700}
.win{position:fixed;left:3%;top:3%;width:94%;height:calc(94% - 32px);background:#ece9d8;border:2px solid #0055e5;border-radius:8px 8px 0 0;display:none;flex-direction:column;z-index:40;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.win.open{display:flex}
.winTitle{background:linear-gradient(180deg,#0997ff,#0055e5 50%,#003c9e);color:#fff;padding:6px 8px;display:flex;align-items:center;gap:8px;font-weight:700;border-radius:6px 6px 0 0}
.winTitle button{margin-left:auto;background:#e81123;color:#fff;border:1px solid #fff;border-radius:3px;width:24px;height:22px;cursor:pointer;font-weight:700}
.winBody{flex:1;overflow:auto;background:#fff}.winBody iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:600px){#hint{display:none}}

/* ===== АДАПТИВ: Яндекс Игры стиль — ПК как ПК, телефон как телефон ===== */
@media (min-width:769px){
  /* ПК — как было: рабочий стол XP, иконки слева колонкой */
  #icons{flex-direction:column}
}
/* МОБИЛЬНАЯ ВЕРСИЯ: ширина <=768px — это и окно ТГ на телефоне */
@media (max-width:768px){
  html,body{overflow:hidden}
  #desktop{inset:0 0 52px 0}
  #hint{display:none}
  /* Иконки — сеткой как приложения на телефоне, а не колонкой слева */
  #icons{top:16px;left:0;right:0;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:10px;padding:0 14px;max-height:calc(100% - 20px)}
  .icon{width:calc(25% - 10px);min-width:68px}
  .icon .logo{width:56px;height:56px;font-size:30px;border-radius:14px}
  .icon span{font-size:12px}
  /* Панель задач — выше, кнопки под палец */
  #taskbar{height:52px}
  #startBtn{font-size:18px;padding:0 20px}
  #clock{padding:0 12px;font-size:13px}
  /* Меню Пуск — на весь экран телефона */
  #startMenu{width:100%;max-width:100%;left:0;bottom:52px;border-radius:12px 12px 0 0;max-height:75vh;overflow:auto}
  #smBody{flex-direction:column;min-height:0}
  #smRight{width:100%;display:flex;gap:4px}
  #smRight .smItem{flex:1;justify-content:center}
  /* Окно игры — на весь экран телефона, без рамок XP */
  .win{left:0;top:0;width:100%;height:calc(100% - 52px);border:0;border-radius:0}
  .winTitle{padding:10px 10px;font-size:15px}
  .winTitle button{width:36px;height:32px;font-size:16px}
}
/* Очень узкие телефоны */
@media (max-width:380px){
  .icon{width:calc(33.33% - 10px)}
  #startMenu{max-height:82vh}
}
</style></head><body>
<div id="desktop"><div id="hill"></div><div id="icons"></div>
<div id="hint"><b>MiniMrGAMES</b> — Windows XP<br>Двойной клик — открыть игру.</div></div>

<div id="startMenu"><div id="smHead">👤 IEUser<br><small style="font-size:12px;font-weight:400">MiniMrGAMES</small></div>
<div id="smBody"><div id="smLeft"><div id="smGames"></div></div>
<div id="smRight"><div class="smItem" onclick="alert('Это демо-рабочий стол.')">🖥 Мой компьютер</div><div class="smItem" onclick="alert('Все игры — иконки на рабочем столе.')">📁 Мои документы</div><div class="smItem" onclick="alert('MiniMrGAMES — библиотека мини-игр в стиле Windows XP')">ℹ️ О программе</div></div></div>
<div id="smFoot"><button onclick="alert('До свидания! 👋')">⏻ Выключить</button><button onclick="closeStart()">Закрыть</button></div></div>
<div class="win" id="gameWin"><div class="winTitle"><span id="winTitle">Игра</span><button onclick="closeWin()">✕</button></div><div class="winBody" id="winBody"></div></div>
<div id="taskbar"><button id="startBtn" onclick="toggleStart()">🪟 Пуск</button><div class="tasks" id="tasks"></div><div id="clock">🕐 <span id="clockTime">--:--</span></div></div>

<script src="games.js"></script>
<script>
function colorFor(n){var c=["#e91e63","#9c27b0","#3f51b5","#009688","#ff9800","#4caf50","#f44336","#2196f3","#795548","#607d8b"];var s=0;for(var i=0;i<n.length;i++)s+=n.charCodeAt(i);return c[s%c.length];}
function builtinGames(){return [{name:"Волшебный сад",type:"builtin",color:"#7cb342",desc:"Кликер"},{name:"Steam Case Simulator",file:"steam-case.html",color:"#1b2838",desc:"Кейсы"}];}
function loadGames(){var l=builtinGames();try{if(window.USER_GAMES&&window.USER_GAMES.length)l=l.concat(window.USER_GAMES);}catch(e){}return l;}
function render(){var games=loadGames();window._games=games;var icons=document.getElementById("icons");icons.innerHTML="";games.forEach(function(g,i){var d=document.createElement("div");d.className="icon";d.innerHTML='<div class="logo" style="background:'+(g.color||colorFor(g.name))+'">'+g.name.trim()[0].toUpperCase()+'</div><span>'+g.name+'</span><small>'+(g.desc||"Игра")+'</small>';d.onclick=function(){document.querySelectorAll(".icon").forEach(function(x){x.classList.remove("selected")});d.classList.add("selected");if(window.matchMedia("(pointer:coarse)").matches){openGame(i);}};d.ondblclick=function(){openGame(i);};icons.appendChild(d);});var sm=document.getElementById("smGames");sm.innerHTML="";games.forEach(function(g,i){var r=document.createElement("div");r.className="smItem";r.innerHTML="🕹 <div><b>"+g.name+"</b><small>"+(g.desc||"Игра")+"</small></div>";r.onclick=function(){closeStart();openGame(i);};sm.appendChild(r);});}
function openGame(i){var g=window._games[i];if(!g)return;var win=document.getElementById("gameWin");win.classList.add("open");document.getElementById("winTitle").textContent="🕹 "+g.name+" — MiniMrGAMES";document.getElementById("tasks").innerHTML='<button class="taskBtn">🕹 '+g.name+'</button>';var body=document.getElementById("winBody");if(g.type==="builtin"){body.innerHTML='<p style="padding:20px">Встроенная заглушка удалена. Игра должна лежать отдельным файлом, см. games.js</p>';}else if(g.content){var blob=new Blob([g.content],{type:"text/html"});body.innerHTML='<iframe src="'+URL.createObjectURL(blob)+'"></iframe>';}else if(g.file){body.innerHTML='<iframe src="'+encodeURI(g.file)+'"></iframe>';}else{body.innerHTML='<p style="padding:20px">Файл не найден: <b>'+(g.file||"")+'</b></p>';}}
function closeWin(){document.getElementById("gameWin").classList.remove("open");document.getElementById("tasks").innerHTML="";}
function toggleStart(){document.getElementById("startMenu").classList.toggle("open");}
function closeStart(){document.getElementById("startMenu").classList.remove("open");}
document.addEventListener("click",function(e){if(!e.target.closest("#startMenu")&&!e.target.closest("#startBtn"))closeStart();});
function tick(){var d=new Date();document.getElementById("clockTime").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
setInterval(tick,1000);tick();
render();
</script></body></html>
