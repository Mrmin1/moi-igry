:root{
  --surface:#eef2fa;
  --ink:#182233;
  --muted:#667085;
  --glass:rgba(255,255,255,.66);
  --line:rgba(255,255,255,.78);
  --blue:#2563eb;
  --violet:#7c3aed;
  --pink:#ec4899
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  font-family:Manrope,system-ui,sans-serif;
  color:var(--ink)
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  min-height:100dvh;
  padding-top:var(--safe-area-inset-top);
  position:relative;
  overflow-x:clip;
  background:radial-gradient(circle at 10% 15%,#dbeafe 0,transparent 35%),radial-gradient(circle at 85% 15%,#ddd6fe 0,transparent 32%),linear-gradient(135deg,#cbd5e1,#a5b4fc 35%,#f0abfc 70%,#67e8f9);
  overflow:hidden
}

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(55px);
  opacity:.72;
  pointer-events:none
}

.b1{
  width:360px;
  height:360px;
  background:#f472b6;
  left:-80px;
  top:60px
}

.b2{
  width:420px;
  height:420px;
  background:#60a5fa;
  right:-100px;
  top:120px
}

.b3{
  width:320px;
  height:320px;
  background:#a78bfa;
  left:38%;
  bottom:80px
}

.topbar{
  height:42px;
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(255,255,255,.32);
  backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(255,255,255,.5);
  font-size:13px
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0
}

.mini-logo{
  width:24px;
  height:24px;
  border-radius:7px;
  background:#111827;
  color:white;
  display:grid;
  place-items:center;
  font-family:Unbounded,sans-serif;
  font-size:13px
}

.date{
  white-space:nowrap
}

.dot{
  opacity:.5
}

.top-search{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  height:30px;
  width:min(360px,35vw);
  border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.65);
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 12px
}

.top-search input{
  border:0;
  outline:0;
  background:transparent;
  width:100%;
  font-size:13px
}

.status{
  display:flex;
  align-items:center;
  gap:14px;
  font-weight:700
}

.status-text{
  display:flex;
  align-items:center;
  gap:4px
}

.clock-mini{
  display:none
}

.desktop{
  position:relative;
  z-index:2;
  min-height:calc(100vh - 190px);
  padding:22px 22px 12px
}

.hero-line{
  max-width:700px;
  text-shadow:0 1px 0 rgba(255,255,255,.45)
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.65);
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800
}

.hero-line h1{
  font-family:Unbounded,sans-serif;
  font-size:clamp(30px,5vw,58px);
  line-height:1.02;
  letter-spacing:-.04em;
  margin:14px 0 10px
}

.hero-line h1 em{
  color:var(--violet);
  font-style:normal
}

.hero-line p{
  margin:0;
  color:#344054;
  font-weight:600
}

.pages-wrap{
  min-height:220px
}

.desktop-grid{
  display:grid;
  grid-template-columns:repeat(8,88px);
  gap:10px 18px;
  justify-content:start;
  margin-top:18px
}

.desktop-icon{
  min-width:88px;
  min-height:112px;
  border:0;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  color:#172033;
  border-radius:15px;
  padding:8px 4px
}

.desktop-icon:hover,.desktop-icon:focus-visible{
  background:rgba(255,255,255,.25);
  outline:2px solid rgba(255,255,255,.8)
}

.icon-box{
  width:72px;
  height:72px;
  border-radius:20px;
  background:linear-gradient(145deg,#fff,#c7d2fe);
  box-shadow:0 10px 24px rgba(15,23,42,.2),inset 0 1px 0 #fff;
  display:grid;
  place-items:center;
  font-size:36px
}

.folder-box{
  background:linear-gradient(145deg,#fde68a,#f59e0b);
  color:#451a03
}

.icon-label{
  font-size:13px;
  font-weight:800;
  text-shadow:0 1px 0 #fff;
  text-align:center;
  line-height:1.1
}

.desktop-icon small{
  font-size:11px;
  color:#475569;
  font-weight:700
}

.dots{
  display:flex;
  gap:7px;
  justify-content:center;
  margin:16px 0 0
}

.dot{
  width:8px;
  height:8px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.55)
}

.dot.active{
  width:24px;
  border-radius:99px;
  background:#111827
}

.empty{
  background:white;
  padding:14px;
  border-radius:12px
}

.empty button{
  border:0;
  background:#111827;
  color:white;
  border-radius:8px;
  padding:7px 10px
}

.toast{
  position:fixed;
  left:50%;
  top:58px;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:10px 12px;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:1000;
  box-shadow:0 12px 30px rgba(0,0,0,.25)
}

.toast button{
  background:transparent;
  color:white;
  border:0
}

.window{
  position:absolute;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(255,255,255,.9);
  border-radius:18px;
  box-shadow:0 28px 70px rgba(15,23,42,.28);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  backdrop-filter:blur(20px)
}

.window.active{
  box-shadow:0 28px 80px rgba(37,99,235,.28)
}

.window.minimized{
  opacity:0;
  pointer-events:none;
  transform:translateY(80px) scale(.9)
}

.window.maximized{
  border-radius:0
}

.titlebar{
  height:46px;
  min-height:46px;
  background:#f8fafc;
  border-bottom:1px solid #e2e8f0;
  display:flex;
  align-items:center;
  padding:0 8px;
  touch-action:none;
  cursor:grab
}

.traffic{
  display:flex;
  gap:7px;
  margin-left:5px
}

.t{
  width:22px;
  height:22px;
  border-radius:50%;
  border:0;
  display:grid;
  place-items:center;
  color:transparent
}

.t:hover{
  color:#111
}

.red{
  background:#ff5f57
}

.yellow{
  background:#febc2e
}

.green{
  background:#28c840
}

.win-title{
  display:flex;
  align-items:center;
  gap:7px;
  margin-left:14px;
  min-width:0;
  white-space:nowrap;
  overflow:hidden
}

.win-title i{
  font-style:normal;
  color:#64748b;
  font-size:12px
}

.win-actions{
  margin-left:auto;
  display:flex
}

.win-actions button{
  width:42px;
  height:34px;
  border:0;
  background:transparent;
  border-radius:8px;
  display:grid;
  place-items:center
}

.win-actions .close:hover{
  background:#ef4444;
  color:white
}

.window-body{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:16px
}

.game-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px
}

.game-cover{
  width:58px;
  height:58px;
  border-radius:16px;
  background:#e0e7ff;
  display:grid;
  place-items:center;
  font-size:30px
}

.game-head h2{
  margin:0;
  font-size:20px
}

.game-head p{
  margin:3px 0 0;
  color:#64748b;
  font-size:13px
}

.direct{
  margin-left:auto;
  min-height:40px;
  border:1px solid #cbd5e1;
  background:white;
  border-radius:10px;
  padding:0 11px;
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:800
}

.frame-wrap{
  height:calc(100% - 80px);
  min-height:290px;
  position:relative;
  background:#0f172a;
  border-radius:13px;
  overflow:hidden
}

.frame-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  background:white
}

.missing{
  position:absolute;
  inset:0;
  background:#f8fafc;
  display:grid;
  place-items:center;
  text-align:center;
  padding:18px
}

.missing-card{
  max-width:440px
}

.missing-card h3{
  margin:10px 0 5px
}

.missing-card p{
  color:#64748b
}

.missing-card button{
  min-height:42px;
  border:0;
  background:#111827;
  color:white;
  border-radius:10px;
  padding:0 14px;
  margin:5px
}

.missing-card .ghost{
  background:#e2e8f0;
  color:#111
}

.inside-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.inside-card{
  border:1px solid #e2e8f0;
  background:white;
  border-radius:14px;
  padding:16px;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:4px;
  min-height:132px
}

.inside-card span{
  font-size:32px
}

.inside-card b{
  font-size:16px
}

.inside-card small{
  color:#64748b
}

.inside-card em{
  font-style:normal;
  color:var(--blue);
  font-weight:800;
  font-size:12px
}

.settings h2{
  margin-top:0
}

.settings label{
  display:block;
  margin:18px 0
}

.settings input{
  width:100%;
  height:44px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:0 12px;
  margin-top:7px
}

.set-row{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #e2e8f0;
  padding:13px 0
}

.primary{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:10px;
  padding:11px 14px;
  font-weight:800
}

.resizer{
  position:absolute;
  right:2px;
  bottom:2px;
  border:0;
  background:transparent;
  color:#94a3b8;
  width:28px;
  height:28px;
  touch-action:none
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:90;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  padding:0 8px calc(4px + var(--safe-area-inset-top))
}

.dock{
  min-height:64px;
  display:flex;
  align-items:end;
  gap:8px;
  background:rgba(255,255,255,.48);
  border:1px solid rgba(255,255,255,.7);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:7px 10px;
  box-shadow:0 12px 35px rgba(0,0,0,.15)
}

.dock-item{
  position:relative;
  border:0;
  background:transparent;
  min-width:48px;
  min-height:52px;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:transform .18s
}

.dock-item label{
  position:absolute;
  top:-30px;
  background:#111827;
  color:white;
  font-size:11px;
  padding:4px 7px;
  border-radius:6px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none
}

.dock-item:hover label,.dock-item:focus-visible label{
  opacity:1
}

.dock-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:26px;
  box-shadow:0 6px 16px rgba(0,0,0,.16)
}

.dock-icon.game{
  background:linear-gradient(145deg,#fff,#c7d2fe)
}

.dock-icon.library{
  background:#111827;
  color:white
}

.dock-icon.settings{
  background:#64748b;
  color:white
}

.dock-sep{
  width:1px;
  height:38px;
  background:#94a3b8
}

.bounce{
  animation:bounce .45s ease
}

@keyframes bounce{
  40%{
    transform:translateY(-18px)
  }

  70%{
    transform:translateY(2px)
  }
}

.taskbar{
  width:min(760px,100%);
  height:52px;
  background:rgba(17,24,39,.94);
  backdrop-filter:blur(20px);
  border-radius:15px 15px 0 0;
  color:white;
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 8px
}

.start-btn,.task-search{
  height:40px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:white;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 11px;
  font-weight:800
}

.start-btn:hover,.start-btn.open,.task-search:hover{
  background:rgba(255,255,255,.15)
}

.win-logo{
  width:22px;
  height:22px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px
}

.win-logo i{
  background:#60a5fa
}

.win-logo i:nth-child(2){
  background:#a78bfa
}

.win-logo i:nth-child(3){
  background:#f472b6
}

.win-logo i:nth-child(4){
  background:#34d399
}

.task-apps{
  flex:1;
  display:flex;
  gap:4px;
  overflow:hidden
}

.task-apps button{
  max-width:150px;
  min-height:40px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:white;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.task-apps button.active{
  background:white;
  color:#111827
}

.task-clock{
  border:0;
  background:transparent;
  color:white;
  text-align:right;
  display:flex;
  flex-direction:column;
  line-height:1.1;
  padding:0 6px
}

.task-clock small{
  font-size:11px;
  color:#cbd5e1
}

.start-menu{
  position:fixed;
  left:50%;
  bottom:122px;
  transform:translateX(-50%);
  width:min(560px,calc(100vw - 20px));
  max-height:calc(100dvh - 210px);
  overflow:auto;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(24px);
  border:1px solid white;
  border-radius:20px;
  box-shadow:0 30px 70px rgba(0,0,0,.3);
  z-index:200;
  padding:18px
}

.start-head{
  display:flex;
  justify-content:space-between
}

.start-head span{
  color:#64748b
}

.start-search{
  margin-top:14px;
  height:44px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px
}

.start-search input{
  border:0;
  outline:0;
  width:100%
}

.sec-title{
  font-size:12px;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.08em
}

.start-pinned{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.start-pinned button{
  border:0;
  background:#f8fafc;
  border-radius:12px;
  padding:12px 5px;
  display:flex;
  flex-direction:column;
  align-items:center
}

.start-pinned button span{
  font-size:26px
}

.start-pinned small{
  color:#64748b
}

.start-list button{
  width:100%;
  border:0;
  background:transparent;
  border-radius:10px;
  padding:9px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left
}

.start-list button:hover{
  background:#f1f5f9
}

.start-list button span{
  font-size:24px
}

.start-list small{
  margin-left:auto;
  color:#64748b
}

.start-foot{
  border-top:1px solid #e2e8f0;
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  padding-top:10px
}

.start-foot button{
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px;
  font-weight:700
}

.context-menu{
  position:fixed;
  z-index:1000;
  width:210px;
  background:white;
  border-radius:13px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
  padding:6px
}

.context-menu button{
  width:100%;
  min-height:42px;
  border:0;
  background:transparent;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:9px;
  text-align:left;
  padding:0 10px
}

.context-menu button:hover{
  background:#f1f5f9
}

.context-menu .danger{
  color:#dc2626
}

@media(max-width:760px){
  .topbar{
    padding:0 10px
  }

  .date,.dot{
    display:none
  }

  .top-search{
    width:150px;
    left:auto;
    right:105px;
    transform:none
  }

  .status-text{
    font-size:0
  }

  .status{
    gap:2px
  }

  .clock-mini{
    display:block;
    font-size:12px
  }

  .desktop{
    padding:16px 12px 8px;
    min-height:calc(100vh - 190px)
  }

  .hero-line h1{
    font-size:32px
  }

  .hero-line p{
    font-size:13px
  }

  .desktop-grid{
    grid-template-columns:repeat(3,1fr);
    gap:8px
  }

  .desktop-icon{
    min-width:0
  }

  .icon-box{
    width:64px;
    height:64px
  }

  .window{
    max-width:100vw
  }

  .inside-grid{
    grid-template-columns:1fr
  }

  .game-head{
    flex-wrap:wrap
  }

  .direct{
    margin-left:0
  }

  .frame-wrap{
    min-height:250px
  }

  .start-pinned{
    grid-template-columns:repeat(2,1fr)
  }

  .task-search span{
    display:none
  }

  .task-apps button{
    font-size:0;
    min-width:42px;
    justify-content:center
  }

  .task-apps button span{
    font-size:18px
  }

  .dock{
    gap:4px;
    padding:6px
  }

  .dock-item{
    min-width:44px
  }

  .dock-icon{
    width:44px;
    height:44px
  }

  .start-menu{
    bottom:118px
  }

  .bottom{
    padding-left:4px;
    padding-right:4px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --surface:#111827;
    --ink:#f8fafc;
    --muted:#cbd5e1
  }

  .shell{
    background:linear-gradient(135deg,#0f172a,#312e81 45%,#701a75 75%,#083344)
  }

  .topbar,.dock{
    background:rgba(15,23,42,.55);
    color:white
  }

  .top-search{
    background:rgba(255,255,255,.15);
    color:white
  }

  .top-search input{
    color:white
  }

  .top-search input::-moz-placeholder{
    color:#cbd5e1
  }

  .top-search input::placeholder{
    color:#cbd5e1
  }

  .desktop-icon,.hero-line p{
    color:white
  }

  .desktop-icon small{
    color:#e2e8f0
  }

  .window{
    background:rgba(30,41,59,.97);
    color:white
  }

  .titlebar{
    background:#1e293b;
    border-color:#334155
  }

  .window-body{
    color:white
  }

  .inside-card,.missing{
    background:#0f172a;
    color:white
  }

  .settings input,.start-menu{
    background:#1e293b;
    color:white
  }

  .start-search input,.start-list button,.start-foot button{
    color:white
  }

  .start-list button:hover{
    background:#334155
  }

  .start-pinned button{
    background:#0f172a;
    color:white
  }

  .missing-card .ghost{
    background:#334155;
    color:white
  }

  .direct{
    background:#0f172a;
    color:white
  }

  .context-menu{
    background:#1e293b;
    color:white
  }

  .context-menu button{
    color:white
  }

  .context-menu button:hover{
    background:#334155
  }
}
